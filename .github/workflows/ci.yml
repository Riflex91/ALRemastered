name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Check repository
        run: npm run check
      - name: Core health check
        run: npm run health
      - name: Normal start stays running
        run: node scripts/smoke-running.mjs

  linux-installer:
    name: Linux installer smoke test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm run build
      - run: npm run installer:linux
      - name: Install to a custom path and verify
        shell: bash
        run: |
          set -euo pipefail
          installer="$(find artifacts -maxdepth 1 -name 'ALRemastered-Linux-*.run' -print -quit)"
          test -n "$installer"
          test_dir="$RUNNER_TEMP/ALRemastered Custom Path"
          "$installer" --install-dir "$test_dir" --yes --no-desktop
          "$test_dir/alremastered" --health-check | grep '"application":"ALRemastered"'
          "$test_dir/alremastered" >"$RUNNER_TEMP/alremastered-linux.log" 2>&1 &
          client_pid=$!
          sleep 1
          kill -0 "$client_pid"
          grep 'Core is running.' "$RUNNER_TEMP/alremastered-linux.log"
          kill "$client_pid"
          wait "$client_pid" || true
          "$test_dir/uninstall.sh" --yes
          test ! -e "$test_dir"
      - uses: actions/upload-artifact@v4
        with:
          name: ALRemastered-Linux-installer
          path: artifacts/ALRemastered-Linux-*.run

  windows-installer:
    name: Windows installer smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Install NSIS
        shell: powershell
        run: choco install nsis --no-progress -y
      - run: npm run build
      - run: npm run installer:windows
      - name: Install to a custom path and verify
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "artifacts\ALRemastered-Windows-*-Setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer artifact was not found." }
          $testDir = Join-Path $env:RUNNER_TEMP "ALRemastered Custom Path"
          $installProcess = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$testDir") -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "Installer returned exit code $($installProcess.ExitCode)" }
          $health = & "$testDir\ALRemastered.cmd" --health-check
          if ($LASTEXITCODE -ne 0 -or $health -notmatch '"application":"ALRemastered"') { throw "Installed client health check failed." }
          $normalLog = Join-Path $env:RUNNER_TEMP "alremastered-windows.log"
          $normalError = Join-Path $env:RUNNER_TEMP "alremastered-windows-error.log"
          $client = Start-Process -FilePath "$testDir\ALRemastered.cmd" -RedirectStandardOutput $normalLog -RedirectStandardError $normalError -PassThru
          Start-Sleep -Seconds 1
          if ($client.HasExited) {
            $normalOutput = if (Test-Path $normalLog) { Get-Content $normalLog -Raw } else { "" }
            $normalErrors = if (Test-Path $normalError) { Get-Content $normalError -Raw } else { "" }
            throw "Installed client exited during normal start. Output: $normalOutput Errors: $normalErrors"
          }
          $normalOutput = Get-Content $normalLog -Raw
          if ($normalOutput -notmatch "Core is running\.") { throw "Installed client did not report a running core. Output: $normalOutput" }
          Stop-Process -Id $client.Id -Force
          $uninstallProcess = Start-Process -FilePath "$testDir\Uninstall.exe" -ArgumentList "/S" -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) { throw "Uninstaller returned exit code $($uninstallProcess.ExitCode)" }
          Start-Sleep -Seconds 1
          if (Test-Path $testDir) { throw "Uninstaller did not remove the custom installation directory." }
      - uses: actions/upload-artifact@v4
        with:
          name: ALRemastered-Windows-installer
          path: artifacts/ALRemastered-Windows-*-Setup.exe
