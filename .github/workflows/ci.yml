          $liveTestState = Invoke-RestMethod "http://127.0.0.1:3210/api/live-test/slice-3-5"
          if ($liveTestState.status -ne "idle") { throw "Slice 3.5 one-click live-test API was not idle on clean CI startup." }
          $scriptRuntime = Invoke-RestMethod "http://127.0.0.1:3210/api/script-runtime"
          if ($scriptRuntime.status -ne "unloaded") { throw "Script runtime was not unloaded on clean CI startup." }
          $slice41LiveTest = Invoke-RestMethod "http://127.0.0.1:3210/api/live-test/slice-4-1"
          if ($slice41LiveTest.status -ne "idle") { throw "Slice 4.1 one-click live-test API was not idle on clean CI startup." }
          $slice42LiveTest = Invoke-RestMethod "http://127.0.0.1:3210/api/live-test/slice-4-2"
