          $slice45LiveTest = Invoke-RestMethod "http://127.0.0.1:3210/api/live-test/slice-4-5"
          if ($slice45LiveTest.status -ne "idle") { throw "Slice 4.5 one-click live-test API was not idle on clean CI startup." }
          $slice51LiveTest = Invoke-RestMethod "http://127.0.0.1:3210/api/live-test/slice-5-1"
          if ($slice51LiveTest.status -ne "idle") { throw "Slice 5.1 heartbeat live-test API was not idle on clean CI startup." }
          $slice52LiveTest = Invoke-RestMethod "http://127.0.0.1:3210/api/live-test/slice-5-2"
          if ($slice52LiveTest.status -ne "idle") { throw "Slice 5.2 reconnect live-test API was not idle on clean CI startup." }
          $slice53LiveTest = Invoke-RestMethod "http://127.0.0.1:3210/api/live-test/slice-5-3"
          if ($slice53LiveTest.status -ne "idle") { throw "Slice 5.3 death/respawn recovery API was not idle on clean CI startup." }
          $slice54LiveTest = Invoke-RestMethod "http://127.0.0.1:3210/api/live-test/slice-5-4"
          if ($slice54LiveTest.status -ne "idle") { throw "Slice 5.4 watchdog/restart-guard API was not idle on clean CI startup." }
          $slice61LiveTest = Invoke-RestMethod "http://127.0.0.1:3210/api/live-test/slice-6-1"
          if ($slice61LiveTest.status -ne "idle") { throw "Slice 6.1 map/geometry-model API was not idle on clean CI startup." }
          $slice62LiveTest = Invoke-RestMethod "http://127.0.0.1:3210/api/live-test/slice-6-2"
          if ($slice62LiveTest.status -ne "idle") { throw "Slice 6.2 simple path-planner API was not idle on clean CI startup." }
          $slice63LiveTest = Invoke-RestMethod "http://127.0.0.1:3210/api/live-test/slice-6-3"
          if ($slice63LiveTest.status -ne "idle") { throw "Slice 6.3 smart_move compatibility API was not idle on clean CI startup." }
          $slice64LiveTest = Invoke-RestMethod "http://127.0.0.1:3210/api/live-test/slice-6-4"
          if ($slice64LiveTest.status -ne "idle") { throw "Slice 6.4 movement-debug API was not idle on clean CI startup." }
          $characterSessions = Invoke-RestMethod "http://127.0.0.1:3210/api/character-sessions"
          if ($characterSessions.sessionLimit -ne 4) { throw "Multi-character session API reported the wrong Character limit." }
          if ($characterSessions.activeSessionCount -ne 0) { throw "Multi-character session API was not idle on clean CI startup." }
          $slice71LiveTest = Invoke-RestMethod "http://127.0.0.1:3210/api/live-test/slice-7-1"
          if ($slice71LiveTest.status -ne "idle") { throw "Slice 7.1 multi-character session API was not idle on clean CI startup." }
          $characterMessaging = Invoke-RestMethod "http://127.0.0.1:3210/api/character-messaging"
          if ($characterMessaging.localOnly -ne $true) { throw "Local Character messaging API was not local-only." }
          if ($characterMessaging.rawSocketAccess -ne $false) { throw "Local Character messaging API reported raw socket access." }
          $slice72LiveTest = Invoke-RestMethod "http://127.0.0.1:3210/api/live-test/slice-7-2"
          if ($slice72LiveTest.status -ne "idle") { throw "Slice 7.2 local Character messaging API was not idle on clean CI startup." }
          $partyCoordinator = Invoke-RestMethod "http://127.0.0.1:3210/api/party-coordinator"
