          $characterCards = Invoke-RestMethod "http://127.0.0.1:3210/api/character-cards"
          if ($characterCards.cards.Count -ne 0) { throw "Character Cards API was not empty before account connection." }
          $slice81LiveTest = Invoke-RestMethod "http://127.0.0.1:3210/api/live-test/slice-8-1"
          if ($slice81LiveTest.status -ne "idle") { throw "Slice 8.1 Character Cards API was not idle on clean CI startup." }
          $setupWizard = Invoke-RestMethod "http://127.0.0.1:3210/api/setup-wizard"
          if ($setupWizard.status -ne "blocked") { throw "Setup Wizard API was not blocked before account connection." }
          $slice82LiveTest = Invoke-RestMethod "http://127.0.0.1:3210/api/live-test/slice-8-2"
          if ($slice82LiveTest.status -ne "idle") { throw "Slice 8.2 Setup Wizard API was not idle on clean CI startup." }
          $templateConfig = Invoke-RestMethod "http://127.0.0.1:3210/api/template-config"
          if ($templateConfig.selectedTemplateId -ne "simple-farmer") { throw "Template Configuration API did not expose Simple Farmer." }
          if ($templateConfig.normalSettingsRequireCodeChanges) { throw "Template Configuration incorrectly required code changes for normal settings." }
          $slice83LiveTest = Invoke-RestMethod "http://127.0.0.1:3210/api/live-test/slice-8-3"
          if ($slice83LiveTest.status -ne "idle") { throw "Slice 8.3 Template Configuration API was not idle on clean CI startup." }
          $explainability = Invoke-RestMethod "http://127.0.0.1:3210/api/explainability"
          if (-not $explainability.readOnly) { throw "Slice 8.4 explainability API was not read-only." }
