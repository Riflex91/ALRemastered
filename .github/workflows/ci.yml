name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Check repository
        run: npm run check
      - name: Core health check
        run: npm run health
      - name: Normal start stays running
        run: node scripts/smoke-running.mjs
      - name: Diagnostic test mode
        run: node scripts/diagnostic-mode-smoke.mjs

  linux-installer:
    name: Linux installer upgrade smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Build version A installer
        shell: bash
        run: |
          set -euo pipefail
          ALREMASTERED_BUILD_VERSION=0.1.0-alpha.28 npm run build
          npm run installer:linux
          cp artifacts/ALRemastered-Linux-*.run "$RUNNER_TEMP/ALRemastered-A.run"
      - name: Install version A to a custom path
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$RUNNER_TEMP/ALRemastered Custom Path"
          "$RUNNER_TEMP/ALRemastered-A.run" --install-dir "$test_dir" --yes --no-desktop
          test "$("$test_dir/alremastered" --version)" = "0.1.0-alpha.28"
          paths_json="$("$test_dir/alremastered" --paths)"
          data_dir="$(node -e 'console.log(JSON.parse(process.argv[1]).dataDir)' "$paths_json")"
          mkdir -p "$data_dir"
          printf 'keep-me\n' > "$data_dir/upgrade-sentinel.txt"
          printf '%s\n' "$data_dir" > "$RUNNER_TEMP/alremastered-data-dir.txt"
      - name: Build version B installer
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run installer:linux
      - name: Verify Linux update handoff survives caller exit
        shell: bash
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/alremastered-linux-update-handoff-marker.txt"
          rm -f "$marker"
          node scripts/linux-update-handoff-smoke.mjs "$marker"
          for attempt in $(seq 1 24); do
            if [ -f "$marker" ]; then break; fi
            sleep 0.25
          done
          test -f "$marker"
          test "$(cat "$marker")" = "started-after-parent-exit"
      - name: Upgrade without choosing the path again and verify
        shell: bash
        run: |
          set -euo pipefail
          installer="$(find artifacts -maxdepth 1 -name 'ALRemastered-Linux-*.run' -print -quit)"
          test_dir="$RUNNER_TEMP/ALRemastered Custom Path"
          data_dir="$(cat "$RUNNER_TEMP/alremastered-data-dir.txt")"
          "$installer" --yes --no-desktop --restart
          test "$("$test_dir/alremastered" --version)" = "0.1.0-alpha.29"
          test "$(cat "$data_dir/upgrade-sentinel.txt")" = "keep-me"
          previous_version="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).version" "$test_dir/.previous/app/package.json")"
          test "$previous_version" = "0.1.0-alpha.28"
          grep 'event=install_success version=0.1.0-alpha.29' "$data_dir/logs/installer.log"
          grep 'event=auto_restart version=0.1.0-alpha.29' "$data_dir/logs/installer.log"
          dashboard_ready=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3210/api/status 2>/dev/null | grep -q '"version":"0.1.0-alpha.29"'; then
              dashboard_ready=1
              break
            fi
            sleep 0.5
          done
          test "$dashboard_ready" -eq 1
          curl -fsS http://127.0.0.1:3210/ | grep 'Debug Console'
          curl -fsS http://127.0.0.1:3210/ | grep 'Check for updates'
          curl -fsS http://127.0.0.1:3210/ | grep 'Diagnostics overview'
          curl -fsS http://127.0.0.1:3210/ | grep 'Adventure Land version'
          curl -fsS http://127.0.0.1:3210/ | grep 'Check game version'
          curl -fsS http://127.0.0.1:3210/ | grep 'Reload game data'
          curl -fsS http://127.0.0.1:3210/ | grep 'Loaded families'
          curl -fsS http://127.0.0.1:3210/ | grep 'Start headless character'
          curl -fsS http://127.0.0.1:3210/ | grep 'Death state'
          curl -fsS http://127.0.0.1:3210/ | grep 'Ping'
          curl -fsS http://127.0.0.1:3210/ | grep 'Gold'
          curl -fsS http://127.0.0.1:3210/ | grep 'Inventory'
          curl -fsS http://127.0.0.1:3210/ | grep 'Equipment'
          curl -fsS http://127.0.0.1:3210/ | grep 'Conditions'
          curl -fsS http://127.0.0.1:3210/ | grep 'Nearby entities'
          curl -fsS http://127.0.0.1:3210/ | grep 'Nearby players'
          curl -fsS http://127.0.0.1:3210/ | grep 'Nearby monsters'
          curl -fsS http://127.0.0.1:3210/ | grep 'Party'
          curl -fsS http://127.0.0.1:3210/ | grep 'Action Gateway'
          curl -fsS http://127.0.0.1:3210/ | grep 'Run gateway probe'
          curl -fsS http://127.0.0.1:3210/ | grep 'Movement test controls'
          curl -fsS http://127.0.0.1:3210/ | grep 'Movement mode'
          curl -fsS http://127.0.0.1:3210/ | grep 'Attack test controls'
          curl -fsS http://127.0.0.1:3210/ | grep 'Attack selected monster once'
          curl -fsS http://127.0.0.1:3210/ | grep 'Skill test controls'
          curl -fsS http://127.0.0.1:3210/ | grep 'Use selected skill once'
          curl -fsS http://127.0.0.1:3210/ | grep 'Loot &amp; consumable test controls'
          curl -fsS http://127.0.0.1:3210/ | grep 'Loot selected chest once'
          curl -fsS http://127.0.0.1:3210/ | grep 'Use selected HP/MP item once'
          curl -fsS http://127.0.0.1:3210/api/action-gateway | grep '"status":"ready"'
          curl -fsS -X POST http://127.0.0.1:3210/api/action-gateway/probe | grep '"outcome":"success"'
          curl -fsS http://127.0.0.1:3210/api/status | grep '"status":"running"'
          curl -fsS http://127.0.0.1:3210/api/game-version | grep '"status":'
          curl -fsS http://127.0.0.1:3210/api/game-data | grep '"status":'
          curl -fsS http://127.0.0.1:3210/api/diagnostics/snapshot | grep '"sanitized":true'
          curl -fsS http://127.0.0.1:3210/api/diagnostics/package | grep 'ALRemasteredDiagnosticPackage'
          curl -fsS http://127.0.0.1:3210/api/update | grep '"currentVersion":"0.1.0-alpha.29"'
          curl -fsS http://127.0.0.1:3210/api/logs/export | grep '"sanitized":true'
          test -f "$data_dir/logs/client.log"
          grep '"level":"INFO"' "$data_dir/logs/client.log"
          grep '"message":"ALRemastered starting."' "$data_dir/logs/client.log"
          grep '"message":"ALRemastered restarted automatically after update."' "$data_dir/logs/client.log"
          pkill -f "$test_dir/app/src/main.js" || true
          sleep 0.5
          "$test_dir/uninstall.sh" --yes
          test ! -e "$test_dir"
          test "$(cat "$data_dir/upgrade-sentinel.txt")" = "keep-me"
      - uses: actions/upload-artifact@v4
        with:
          name: ALRemastered-Linux-installer
          path: artifacts/ALRemastered-Linux-*.run

  windows-installer:
    name: Windows installer upgrade smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Install NSIS
        shell: powershell
        run: choco install nsis --no-progress -y
      - name: Build version A installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:ALREMASTERED_BUILD_VERSION = "0.1.0-alpha.28"
          npm run build
          npm run installer:windows
          Copy-Item (Get-ChildItem "artifacts\ALRemastered-Windows-*-Setup.exe" | Select-Object -First 1).FullName "$env:RUNNER_TEMP\ALRemastered-A.exe"
      - name: Install version A to a custom path
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $testDir = Join-Path $env:RUNNER_TEMP "ALRemastered Custom Path"
          $installProcess = Start-Process -FilePath "$env:RUNNER_TEMP\ALRemastered-A.exe" -ArgumentList @("/S", "/D=$testDir") -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "Version A installer returned exit code $($installProcess.ExitCode)" }
          $version = & "$testDir\ALRemastered.exe" --version
          if ($version.Trim() -ne "0.1.0-alpha.28") { throw "Expected version A, got $version" }
          $paths = (& "$testDir\ALRemastered.exe" --paths) | ConvertFrom-Json
          New-Item -ItemType Directory -Path $paths.dataDir -Force | Out-Null
          Set-Content -Path (Join-Path $paths.dataDir "upgrade-sentinel.txt") -Value "keep-me" -NoNewline
          Set-Content -Path "$env:RUNNER_TEMP\alremastered-data-dir.txt" -Value $paths.dataDir -NoNewline
      - name: Build version B installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item Env:ALREMASTERED_BUILD_VERSION -ErrorAction SilentlyContinue
          npm run build
          npm run installer:windows
      - name: Verify Windows update handoff survives caller exit
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $marker = Join-Path $env:RUNNER_TEMP "alremastered-update-handoff-marker.txt"
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          node scripts/windows-update-handoff-smoke.mjs $marker
          for ($attempt = 0; $attempt -lt 24 -and -not (Test-Path $marker); $attempt++) {
            Start-Sleep -Milliseconds 250
          }
          if (-not (Test-Path $marker)) { throw "Detached Windows update process did not survive the caller exit." }
          if ((Get-Content $marker -Raw) -ne "started-after-parent-exit") { throw "Windows update handoff marker was invalid." }
      - name: Upgrade without choosing the path again and verify
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "artifacts\ALRemastered-Windows-*-Setup.exe" | Select-Object -First 1
          $testDir = Join-Path $env:RUNNER_TEMP "ALRemastered Custom Path"
          $dataDir = Get-Content "$env:RUNNER_TEMP\alremastered-data-dir.txt" -Raw

          $oldLog = Join-Path $env:RUNNER_TEMP "alremastered-old-windows.log"
          $oldError = Join-Path $env:RUNNER_TEMP "alremastered-old-windows-error.log"
          $oldClient = Start-Process -FilePath "$testDir\ALRemastered.exe" -ArgumentList @("--no-open-dashboard", "--no-update-check", "--no-game-version-check", "--no-game-data-load") -RedirectStandardOutput $oldLog -RedirectStandardError $oldError -PassThru

          $oldDashboardReady = $false
          for ($attempt = 0; $attempt -lt 40; $attempt++) {
            try {
              $oldDashboardStatus = Invoke-RestMethod "http://127.0.0.1:3210/api/status"
              if ($oldDashboardStatus.version -eq "0.1.0-alpha.28") {
                $oldDashboardReady = $true
                break
              }
            } catch {}
            Start-Sleep -Milliseconds 250
          }
          if (-not $oldDashboardReady) { throw "Version A dashboard did not start before upgrade." }

          $upgradeProcess = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/ALRUPDATE=1", "/ALRWAITPID=$($oldClient.Id)") -PassThru
          Start-Sleep -Milliseconds 750

          $versionWhileWaiting = & "$testDir\ALRemastered.exe" --version
          if ($versionWhileWaiting.Trim() -ne "0.1.0-alpha.28") {
            throw "Automatic updater modified the installation before the previous client exited."
          }

          & taskkill.exe /PID $oldClient.Id /T /F | Out-Null

          $dashboardReady = $false
          for ($attempt = 0; $attempt -lt 120; $attempt++) {
            try {
              $dashboardStatus = Invoke-RestMethod "http://127.0.0.1:3210/api/status"
              if ($dashboardStatus.version -eq "0.1.0-alpha.29") {
                $dashboardReady = $true
                break
              }
            } catch {}
            Start-Sleep -Milliseconds 500
          }
          if (-not $dashboardReady) { throw "Updated ALRemastered did not restart its dashboard automatically." }

          if (-not $upgradeProcess.HasExited) {
            $upgradeProcess.WaitForExit(10000) | Out-Null
            $upgradeProcess.Refresh()
          }
          if (-not $upgradeProcess.HasExited) { throw "Update installer did not close after successful installation." }
          if ($upgradeProcess.ExitCode -ne 0) { throw "Version B installer returned exit code $($upgradeProcess.ExitCode)" }

          $remainingInstaller = Get-Process -ErrorAction SilentlyContinue | Where-Object {
            try { $_.Path -eq $installer.FullName } catch { $false }
          }
          if ($remainingInstaller) { throw "Update installer process remained open after installation." }

          $version = & "$testDir\ALRemastered.exe" --version
          if ($version.Trim() -ne "0.1.0-alpha.29") { throw "Expected version B, got $version" }
          if ((Get-Content (Join-Path $dataDir "upgrade-sentinel.txt") -Raw) -ne "keep-me") { throw "User data was not preserved." }
          $previous = Get-Content "$testDir\.previous\app\package.json" -Raw | ConvertFrom-Json
          if ($previous.version -ne "0.1.0-alpha.28") { throw "Previous version was not retained for rollback." }

          if (Test-Path "$testDir\ALRemastered.cmd") { throw "Legacy batch launcher must not be installed." }

          $autoClient = Get-Process -Name "ALRemastered" -ErrorAction SilentlyContinue | Where-Object {
            try { $_.Path -eq "$testDir\ALRemastered.exe" } catch { $false }
          } | Select-Object -First 1
          if (-not $autoClient) { throw "Updated ALRemastered.exe was not started automatically." }

          $dashboardPage = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:3210/"
          if ($dashboardPage.Content -notmatch "Debug Console") { throw "Dashboard UI was not available." }
          if ($dashboardPage.Content -notmatch "Check for updates") { throw "Update controls were not available." }
          if ($dashboardPage.Content -notmatch "Diagnostics overview") { throw "Diagnostics overview was not available." }
          if ($dashboardPage.Content -notmatch "Adventure Land version") { throw "Game version status was not available." }
          if ($dashboardPage.Content -notmatch "Check game version") { throw "Game version check control was not available." }
          if ($dashboardPage.Content -notmatch "Reload game data") { throw "Game data reload control was not available." }
          if ($dashboardPage.Content -notmatch "Loaded families") { throw "Game data family summary was not available." }
          if ($dashboardPage.Content -notmatch "Start headless character") { throw "Headless character controls were not available." }
          if ($dashboardPage.Content -notmatch "Death state") { throw "Character death state was not available." }
          if ($dashboardPage.Content -notmatch "Ping") { throw "Character ping state was not available." }
          if ($dashboardPage.Content -notmatch "Gold") { throw "Character gold state was not available." }
          if ($dashboardPage.Content -notmatch "Inventory") { throw "Character inventory state was not available." }
          if ($dashboardPage.Content -notmatch "Equipment") { throw "Character equipment state was not available." }
          if ($dashboardPage.Content -notmatch "Conditions") { throw "Character condition state was not available." }
          if ($dashboardPage.Content -notmatch "Nearby entities") { throw "Nearby entity state was not available." }
          if ($dashboardPage.Content -notmatch "Nearby players") { throw "Nearby player state was not available." }
          if ($dashboardPage.Content -notmatch "Nearby monsters") { throw "Nearby monster state was not available." }
          if ($dashboardPage.Content -notmatch "Party") { throw "Character party state was not available." }
          if ($dashboardPage.Content -notmatch "Action Gateway") { throw "Action Gateway status was not available." }
          if ($dashboardPage.Content -notmatch "Run gateway probe") { throw "Action Gateway probe control was not available." }
          if ($dashboardPage.Content -notmatch "Movement test controls") { throw "Movement test controls were not available." }
          if ($dashboardPage.Content -notmatch "Movement mode") { throw "Movement mode selector was not available." }
          if ($dashboardPage.Content -notmatch "Attack test controls") { throw "Attack test controls were not available." }
          if ($dashboardPage.Content -notmatch "Attack selected monster once") { throw "Attack test button was not available." }
          if ($dashboardPage.Content -notmatch "Skill test controls") { throw "Skill test controls were not available." }
          if ($dashboardPage.Content -notmatch "Use selected skill once") { throw "Skill test button was not available." }
          if ($dashboardPage.Content -notmatch "Loot &amp; consumable test controls") { throw "Loot and consumable test controls were not available." }
          if ($dashboardPage.Content -notmatch "Loot selected chest once") { throw "Loot test button was not available." }
          if ($dashboardPage.Content -notmatch "Use selected HP/MP item once") { throw "Consumable test button was not available." }

          $actionGateway = Invoke-RestMethod "http://127.0.0.1:3210/api/action-gateway"
          if ($actionGateway.status -ne "ready") { throw "Action Gateway API was not ready." }
          $gatewayProbe = Invoke-RestMethod -Method Post "http://127.0.0.1:3210/api/action-gateway/probe"
          if ($gatewayProbe.outcome -ne "success") { throw "Action Gateway probe did not succeed." }
          if ($gatewayProbe.requestId -notmatch "^act-") { throw "Action Gateway probe did not return a request ID." }

          $dashboardStatus = Invoke-RestMethod "http://127.0.0.1:3210/api/status"
          if ($dashboardStatus.status -ne "running") { throw "Dashboard status endpoint did not report a running core." }
          if ($dashboardStatus.version -ne "0.1.0-alpha.29") { throw "Automatically restarted client reported the wrong version." }

          $dashboardGameVersion = Invoke-RestMethod "http://127.0.0.1:3210/api/game-version"
          if ($dashboardGameVersion.status -notin @("idle", "checking", "current", "changed", "error")) { throw "Game version API returned an invalid state." }
          $dashboardGameData = Invoke-RestMethod "http://127.0.0.1:3210/api/game-data"
          if ($dashboardGameData.status -notin @("idle", "loading", "loaded", "error")) { throw "Game data API returned an invalid state." }

          $dashboardUpdate = Invoke-RestMethod "http://127.0.0.1:3210/api/update"
          if ($dashboardUpdate.currentVersion -ne "0.1.0-alpha.29") { throw "Update API returned the wrong client version." }
          $diagnosticsSnapshot = Invoke-RestMethod "http://127.0.0.1:3210/api/diagnostics/snapshot"
          if (-not $diagnosticsSnapshot.sanitized) { throw "Diagnostics snapshot was not marked as sanitized." }
          if ($diagnosticsSnapshot.components.Count -lt 5) { throw "Diagnostics component health was incomplete." }
          $diagnosticsPackage = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:3210/api/diagnostics/package"
          if ($diagnosticsPackage.Content -notmatch "ALRemasteredDiagnosticPackage") { throw "Diagnostic package was not available." }
          $dashboardExport = Invoke-RestMethod "http://127.0.0.1:3210/api/logs/export"
          if (-not $dashboardExport.sanitized) { throw "Dashboard log export was not marked as sanitized." }

          $paths = (& "$testDir\ALRemastered.exe" --paths) | ConvertFrom-Json
          $clientLog = Join-Path $paths.logsDir "client.log"
          if (-not (Test-Path $clientLog)) { throw "Structured client log was not created." }
          $clientLogText = Get-Content $clientLog -Raw
          if ($clientLogText -notmatch '"level":"INFO"') { throw "Structured client log contains no INFO record." }
          if ($clientLogText -notmatch '"message":"ALRemastered starting\."') { throw "Client startup was not logged." }
          if ($clientLogText -notmatch '"message":"ALRemastered restarted automatically after update\."') { throw "Automatic post-update restart was not logged." }

          & taskkill.exe /PID $autoClient.Id /T /F | Out-Null
          Start-Sleep -Milliseconds 500
          $uninstallProcess = Start-Process -FilePath "$testDir\Uninstall.exe" -ArgumentList "/S" -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) { throw "Uninstaller returned exit code $($uninstallProcess.ExitCode)" }
          Start-Sleep -Seconds 1
          if (Test-Path $testDir) { throw "Uninstaller did not remove the installation directory." }
          if ((Get-Content (Join-Path $dataDir "upgrade-sentinel.txt") -Raw) -ne "keep-me") { throw "Uninstall removed user data unexpectedly." }
      - uses: actions/upload-artifact@v4
        with:
          name: ALRemastered-Windows-installer
          path: artifacts/ALRemastered-Windows-*-Setup.exe
